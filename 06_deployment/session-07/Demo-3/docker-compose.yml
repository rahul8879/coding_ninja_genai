services:

  chat-service:
    build:
      context: ./chat-service
    container_name: policy-chat-service
    ports:
      - "8000:8000"
    environment:
      RETRIEVAL_SERVICE_URL: http://retrieval-service:8001
      LLM_SERVICE_URL: http://llm-service:8002
    depends_on:
      - retrieval-service
      - llm-service

  retrieval-service:
    build:
      context: ./retrieval-service
    container_name: policy-retrieval-service
    ports:
      - "8001:8001"

  llm-service:
    build:
      context: ./llm-service
    container_name: policy-llm-service
    ports:
      - "8002:8002"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
