# One Nginx worker keeps request distribution simple for this demo.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Our three application instances.
    upstream policy_apps {
        server scaling-app-1:8000;
        server scaling-app-2:8000;
        server scaling-app-3:8000;
    }

    server {
        listen 80;

        location / {
            # Forward the request to one application instance.
            proxy_pass http://policy_apps;

            # Allow enough time for our simulated processing and queue.
            proxy_read_timeout 90s;
        }
    }
}